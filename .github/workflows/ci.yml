name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # PostgreSQL, comme le developpement et la production. La CI tournait sur
    # SQLite, dont le verrou global serialise les ecritures : une course entre
    # deux requetes concurrentes y est invisible, et c'est precisement ainsi
    # qu'un 500 du lecteur tuile est passe entre les mailles.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bibliogabon
          POSTGRES_PASSWORD: bibliogabon
          POSTGRES_DB: bibliogabon
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://bibliogabon:bibliogabon@127.0.0.1:5432/bibliogabon

    steps:
      - uses: actions/checkout@v4

      # L'OCR est au coeur du produit : sans le binaire, huit tests se
      # sautaient en silence et la CI ne validait jamais la reconnaissance
      # de texte. REQUIRE_OCR transforme un saut en echec, pour qu'une image
      # amputee se signale au lieu de reduire la couverture sans bruit.
      - name: Install tesseract
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fra

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python -m pytest -q
        env:
          REQUIRE_OCR: "1"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Aligne la CI sur .nvmrc : « node-version: 20 » resolvait vers le
          # dernier 20.x cote CI pendant qu'une machine locale en 20.9 cassait
          # sur node:util.styleText. Une divergence CI/local silencieuse.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
