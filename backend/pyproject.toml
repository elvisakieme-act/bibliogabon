[project]
name = "bibliogabon-backend"
version = "0.1.0"
description = "BiblioGABON backend"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<6.0",
  "dj-database-url>=2.2,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "djangorestframework>=3.15,<4.0",
  "djangorestframework-simplejwt>=5.5,<6.0",
  "drf-spectacular[sidecar]>=0.28,<1.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "api*",
  "accounts*",
  "analytics*",
  "billing*",
  "catalog*",
  "config*",
  "document_ingestion*",
  "document_processing*",
  "document_reader*",
  "operations*",
  "search_discovery*",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-django>=4.9,<5.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = [
  "api/v1/tests",
  "accounts/tests",
  "config/tests",
  "catalog/tests",
  "document_ingestion/tests",
  "document_processing/tests",
  "document_reader/tests",
  "search_discovery/tests",
  "billing/tests",
  "operations/tests",
  "analytics/tests",
]
