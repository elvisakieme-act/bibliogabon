[project]
name = "bibliogabon-backend"
version = "0.1.0"
description = "BiblioGABON backend"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<6.0",
  "dj-database-url>=2.2,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "djangorestframework>=3.15,<4.0",
  "djangorestframework-simplejwt>=5.5,<6.0",
  "drf-spectacular[sidecar]>=0.28,<1.0",
  "pypdf>=6.0,<7.0",
  "celery>=5.4,<6.0",
  "redis>=5.0,<7.0",
  "django-storages[s3]>=1.14,<2.0",
  "pymupdf>=1.24,<2.0",
  "pytesseract>=0.3.10,<1.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "api*",
  "accounts*",
  "analytics*",
  "billing*",
  "catalog*",
  "config*",
  "document_ingestion*",
  "document_processing*",
  "document_reader*",
  "operations*",
  "search_discovery*",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.14,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-django>=4.9,<5.0",
  "moto[s3]>=5.0,<6.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = [
  "api/v1/tests",
  "api/staff/v1/tests",
  "accounts/tests",
  "config/tests",
  "catalog/tests",
  "document_ingestion/tests",
  "document_processing/tests",
  "document_reader/tests",
  "search_discovery/tests",
  "billing/tests",
  "operations/tests",
  "analytics/tests",
]

[tool.ruff]
# Aligne sur la largeur choisie cote frontend, pour une seule regle de
# lisibilite dans tout le depot.
line-length = 96
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes : imports et variables inutilisees, noms inconnus
  "I",    # ordre des imports
  "UP",   # tournures obsoletes pour la version de Python ciblee
  "B",    # bugbear : pieges reels, pas du style
  "DJ",   # regles specifiques a Django
  "C4",   # comprehensions
]

ignore = [
  # La mise en page appartient au formateur (`ruff format`), qui garantit
  # deja que le code tient dans la largeur. Ne restent sous E501 que des
  # chaines litterales — messages, descriptions OpenAPI — que le formateur
  # ne coupe pas a dessein. Les decouper a la main rend un message
  # introuvable au grep sans rien gagner en lisibilite.
  "E501",
]
