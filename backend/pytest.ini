[pytest]
DJANGO_SETTINGS_MODULE = config.settings
# Chargé avant que pytest-django n'initialise les réglages : neutralise
# le `.env` local, pour que la suite se comporte à l'identique partout.
addopts = -p config.pytest_env
python_files = test_*.py *_test.py
testpaths = api/v1/tests api/staff/v1/tests accounts/tests config/tests catalog/tests document_ingestion/tests document_processing/tests document_reader/tests search_discovery/tests billing/tests operations/tests analytics/tests
